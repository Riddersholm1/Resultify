name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_QUALITY: "ga"
  CONFIGURATION: Release

jobs:
  build-test-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink / versioning

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Resultify/Resultify.csproj | head -1)
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version from the release tag or src/Resultify/Resultify.csproj."
            exit 1
          fi

          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          -c ${{ env.CONFIGURATION }}
          -warnaserror
          -p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.VERSION }}

      # Arguments after `--` are forwarded to the test application. The report and coverage options
      # come from extensions the test project references (xunit.v3 and
      # Microsoft.Testing.Extensions.CodeCoverage); both reports land in the test project's
      # TestResults directory, which the globs below pick up.
      - name: Test
        run: >
          dotnet test --no-build -c ${{ env.CONFIGURATION }} --
          --report-xunit-trx --report-xunit-trx-filename test-results.trx
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false

      - name: Pack
        run: >
          dotnet pack src/Resultify/Resultify.csproj
          --no-build
          -c ${{ env.CONFIGURATION }}
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Upload symbol package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-symbols
          path: ./artifacts/*.snupkg

  publish:
    name: Publish to NuGet.org
    needs: build-test-pack
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token, which NuGet.org trades for a short-lived API key.
      # This is what NuGet trusted publishing runs on: without it there is no token to exchange.
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Download symbols
        uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-symbols
          path: ./artifacts

      - name: Check trusted publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository variable is not set. Set it to the NuGet.org username that created the 'Resultify-GitHubActions' trusted publishing policy, under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # Exchanges the job's OIDC token for a temporary NuGet.org API key. NuGet.org matches the
      # token's claims (repository owner, repository, and this workflow file) against the
      # 'Resultify-GitHubActions' trusted publishing policy, so the policy name itself is not
      # referenced here and no long-lived API key is stored in the repository. Renaming or moving
      # this workflow file invalidates the match until the policy is updated.
      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
